# Inspired by: https://blog.raftech.nl/automate-terraform-modules-versioning-with-github-actions-90f91351506a

name: Terraform Module PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# No job in this workflow writes to the repo any more — the docs job checks for
# drift instead of pushing it. Stating that here means the token handed to every
# third-party action in the file cannot commit, whatever the repository-wide
# default happens to be set to.
permissions:
  contents: read

# The previous version of this job was named "Terraform Validate" but ran only
# `terraform fmt`, and its "Terraform Validate Status" step was gated on
# `steps.plan.outcome` when no step declared `id: plan` — so that step never ran
# and could never fail the job. The result was a green check that asserted
# formatting alone while reading as validation. This module ships security
# controls into consumers' bucket policies; a check that only looks like a gate
# is worse than no gate.
jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1  # v2
        with:
          terraform_wrapper: false

      # -recursive so the test fixture is covered too, not just the root module.
      - name: Terraform fmt
        run: terraform fmt -check=true -diff=true -recursive

      # -backend=false: this is a module, it has no backend to configure.
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: No stray whitespace
        run: git diff --check

      # A tag is mutable, so a floating ref does not guarantee the workflow runs
      # the action code that was reviewed.
      #
      # This used to be the denylist grep from blessed-cicd docs/sha-pinning.md,
      # inline. It passed while two floating refs sat in terraform-publish.yaml,
      # because it only matched float spellings someone had enumerated and the
      # quoting defeated its anchor. The audit is now an allowlist with its own
      # self-test — see tests/assert-actions-pinned.sh for the specific blind
      # spots it is built to keep out. The blessed-cicd example needs the same
      # correction; that is a separate change to that repo.
      - name: Third-party actions must be SHA-pinned
        run: bash tests/assert-actions-pinned.sh

  # The behaviour this module documents is PROVIDER behaviour, so it has to be
  # exercised against the pinned provider on real CI rather than asserted in
  # prose. It runs no AWS API calls and needs no credentials.
  policy_composition:
    name: Policy composition regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1  # v2
        with:
          terraform_wrapper: false

      - name: Compose policies against the pinned AWS provider
        run: bash tests/assert-composition.sh

  # Note: the `Check for semantic version label` and `Check for pull
  # request type label` jobs that used to live here have been removed.
  # They duplicated what .github/workflows/pr-labels.yml and
  # pr-auto-label.yml already do, but worse — they used the
  # agilepathway/pull-request-label-checker Docker action that fails
  # with no PR comment, while pr-labels.yml posts a helpful comment
  # suggesting a label based on branch name. With both running, a
  # missing semver label produced two failed checks and one comment —
  # one of those failed checks was just visual noise.
  #
  # When this repo migrates to the JonathanPorta/blessed-cicd reusable
  # PR-labels workflow, pr-labels.yml + pr-auto-label.yml get replaced
  # by a single caller too. Tracked in the blessed-cicd vendoring
  # tracker issue.

  # This job used to run terraform-docs/gh-actions with `git-push: 'true'`.
  # Pinning that action to a commit did not pin what executed: its action.yml
  # delegates to `docker://quay.io/terraform-docs/gh-actions:1.0.0`, and a
  # registry tag is mutable, so the reviewed commit froze the wrapper and not
  # the code. Combined with push access to the PR branch, repointing one Quay
  # tag would have bought both arbitrary execution and a commit on the branch
  # under review.
  #
  # It now verifies instead of writing: same renderer, fetched by checksum, and
  # the job is read-only. See tests/render-docs.sh.
  docs:
    name: README is in sync with terraform-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Render docs
        run: bash tests/render-docs.sh

      # Reporting the drift beats silently committing it: a README that changed
      # because a variable's contract changed is something a reviewer should see
      # in the diff, not something CI quietly appends after approval.
      - name: README is up to date
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error::README.md is stale — run 'bash tests/render-docs.sh' and commit the result"
            exit 1
          fi
          echo "README.md matches terraform-docs output"
