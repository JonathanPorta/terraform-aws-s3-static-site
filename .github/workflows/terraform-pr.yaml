# Inspired by: https://blog.raftech.nl/automate-terraform-modules-versioning-with-github-actions-90f91351506a

name: Terraform Module PR
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# The previous version of this job was named "Terraform Validate" but ran only
# `terraform fmt`, and its "Terraform Validate Status" step was gated on
# `steps.plan.outcome` when no step declared `id: plan` — so that step never ran
# and could never fail the job. The result was a green check that asserted
# formatting alone while reading as validation. This module ships security
# controls into consumers' bucket policies; a check that only looks like a gate
# is worse than no gate.
jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      # -recursive so the test fixture is covered too, not just the root module.
      - name: Terraform fmt
        run: terraform fmt -check=true -diff=true -recursive

      # -backend=false: this is a module, it has no backend to configure.
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: No stray whitespace
        run: git diff --check

  # The behaviour this module documents is PROVIDER behaviour, so it has to be
  # exercised against the pinned provider on real CI rather than asserted in
  # prose. It runs no AWS API calls and needs no credentials.
  policy_composition:
    name: Policy composition regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Compose policies against the pinned AWS provider
        run: bash tests/assert-composition.sh

  # Note: the `Check for semantic version label` and `Check for pull
  # request type label` jobs that used to live here have been removed.
  # They duplicated what .github/workflows/pr-labels.yml and
  # pr-auto-label.yml already do, but worse — they used the
  # agilepathway/pull-request-label-checker Docker action that fails
  # with no PR comment, while pr-labels.yml posts a helpful comment
  # suggesting a label based on branch name. With both running, a
  # missing semver label produced two failed checks and one comment —
  # one of those failed checks was just visual noise.
  #
  # When this repo migrates to the JonathanPorta/blessed-cicd reusable
  # PR-labels workflow, pr-labels.yml + pr-auto-label.yml get replaced
  # by a single caller too. Tracked in the blessed-cicd vendoring
  # tracker issue.

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Render terraform docs inside the README.md and push changes back to PR branch
        uses: terraform-docs/gh-actions@v1.0.0
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: 'true'
