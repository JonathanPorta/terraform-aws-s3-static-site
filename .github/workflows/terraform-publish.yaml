# Inspired by: https://blog.raftech.nl/automate-terraform-modules-versioning-with-github-actions-90f91351506a

name: Release Terraform Module
on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      # These two were the last floating refs in the repo, and the worst place
      # to leave one: this job computes the version number and then creates the
      # release tag. A retagged upstream here does not just run unreviewed code
      # in a credentialed job, it can steer the version handed to the tag steps
      # below.
      - name: 'Get Previous tag'
        id: previoustag
        uses: 'WyriHaximus/github-action-get-previous-tag@04e8485ecb6487243907e330d522ff60f02283ce' # v1.4.0
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

      # Pinned to the v1.2.1 release commit rather than to whatever `v1`
      # resolves to. In this repo `v1` is not the head of the v1 line at all —
      # it points at a commit 63 behind v1.2.1 — which is exactly the kind of
      # thing a floating ref hides. v1.2.1 still declares the major/minor/patch
      # outputs consumed below.
      - name: 'Get next version'
        id: semvers
        uses: 'WyriHaximus/github-action-next-semvers@18aa9ed4152808ab99b88d71f5481e41f8d89930' # v1.2.1
        with:
          version: ${{ steps.previoustag.outputs.tag }}

      - uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72  # v1
        if: contains(github.event.pull_request.labels.*.name, 'minor')
        with:
          tag: '${{ steps.semvers.outputs.minor }}'

      - uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72  # v1
        if: contains(github.event.pull_request.labels.*.name, 'major')
        with:
          tag: '${{ steps.semvers.outputs.major }}'

      - uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72  # v1
        if: contains(github.event.pull_request.labels.*.name, 'patch')
        with:
          tag: '${{ steps.semvers.outputs.patch }}'
